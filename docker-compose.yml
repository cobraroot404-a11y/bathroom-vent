services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: bathroom-vent-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  automation:
    build:
      context: ./service
    container_name: bathroom-vent-automation
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_KEEPALIVE_S: "60"
      CMD_TTL_S: "1200"

volumes:
  mosquitto-data:
