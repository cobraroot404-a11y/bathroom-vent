# Mosquitto 2.x config for the bathroom-vent prototype.
#
# Anonymous access is intentionally permitted here so the prototype runs
# with zero setup out of the box. This is fine on a private LAN for a
# throwaway/private-repo prototype; before exposing this broker beyond your
# own network, set password_file / a proper listener with TLS and disable
# allow_anonymous. See README.md "Known limitations".

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
